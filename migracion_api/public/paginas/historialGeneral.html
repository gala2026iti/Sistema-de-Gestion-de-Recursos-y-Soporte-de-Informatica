<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historial General</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/historial.css">
</head>

<body>

    <header class="d-flex justify-content-center align-items-center py-4">
        <img class="img-logo" src="../assets/img/logo_iti.png" alt="Logo">
    </header>

    <nav class="navbarSGRSI">
        <section class="nav-container">

            <section class="nav-primera-fila">

                <button class="btn-menu" id="btnMenu">
                    ☰
                </button>

                <button class="btn-cerrar-lateral" id="btnCerrar">
                    X
                </button>

                <ul class="nav-opciones-sistema">

                    <li class="desplegable desplegable-derecha" id="menuUsuario">

                        <a href="#" id="datosUsuario">
                            Usuario 🡻
                        </a>

                        <ul class="desplegable-menu" id="opcionesRoles">

                            <li>
                                <a href="#" id="cerrarSesion">
                                    Cerrar Sesion
                                </a>
                            </li>

                        </ul>

                    </li>

                </ul>

            </section>

        </section>
    </nav>


    <main class="container-fluid px-4 py-4">

        <section class="mb-4 border-bottom pb-2 d-flex align-items-center justify-content-between w-100">
            <section>

                <h2 class="text-start mb-1 text-primary" id="tituloHistorial">
                    Historial
                </h2>

                <span class="text-muted fs-6" id="descripcionHistorial">
                    Registros cronológicos del sistema
                </span>
            </section>

            <section class="d-flex align-items-center gap-2">

                <label for="filtroFecha" class="text-muted small fw-bold">
                    Filtrar:
                </label>

                <input type="date" id="filtroFecha" class="form-control form-control-sm">

            </section>
        </section>


        <section id="contenedorHistorial"></section>


        <section class="mt-4">

            <a href="#" id="btnVolverHistorial" class="btn-asignar">
                Volver
            </a>

        </section>

    </main>


    <footer>
        <span class="footer-bold">
            Copyright 2026 - S.G.R.S.I -
            Instituto Tecnológico de Informática
        </span>
    </footer>
    <script src="../assets/js/btnMenuCelular.js"></script>
    <script src="../assets/js/verificarSesion.js"></script>
    <script src="../assets/js/cerrarSesion.js"></script>
    <script src="../assets/js/historialGeneral.js"></script>
