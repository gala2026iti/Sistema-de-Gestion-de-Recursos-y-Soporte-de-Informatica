<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/formularioTickets.css">
     <link rel="stylesheet" href="../assets/css/formulariospopup.css">
</head>

<body data-rol-permitido="docente">
    <header class="d-flex justify-content-center align-items-center py-4">
        <img class="imagen img-fluid" src="../assets/img/logo_iti.png" alt="Logo">
    </header>

    <nav class="navbarSGRSI">
        <section class="nav-container">
             <section class="nav-primera-fila">
                <button class="btn-menu" id="btn-menu">☰</button>
                <button class="btn-cerrar" id="btn-cerrar">✖</button>
            </section>
            <ul class="nav-menu">
                <li><a href="homeDocente.html" id="btnIncidencias">Registro de incidencias</a></li>
                <li><a href="pagsolicitudes.html" id="btnServicios">Solicitud de servicios</a></li>
            </ul>
                <ul class="nav-opciones-sistema">
                <li><a  id="cerrarSesion">Cerrar Sesion</a></li>
                </ul>
        </section>
    </nav>

    <main class="main-formulario d-flex justify-content-center align-items-center py-5 px-3">
        <section class="w-100 container-formulario">
            <h2 class="mb-4 fw-bold text-center texto-azul">Registro de incidencias</h2>

            <form action="confirmacion-ticket.html" class="p-4 shadow border-0 bg-Formulario rounded-4">

                <div class="campo mb-4">
                    <label for="sector" class="form-label fw-semibold texto-azul-dark">Seleccione taller o
                        laboratorio</label>
                    <select id="sector" name="sector" class="form-select form-select-lg" required>
                        <option value="">Seleccione una opción</option>
                        <optgroup label="Laboratorios">
                            <option value="lab1">Laboratorio 1</option>
                            <option value="lab2">Laboratorio 2</option>
                            <option value="lab3">Laboratorio 3</option>
                            <option value="lab4">Laboratorio 4</option>
                        </optgroup>
                        <optgroup label="Talleres">
                            <option value="taller1">Taller 1</option>
                            <option value="taller2">Taller 2</option>
                            <option value="taller3">Taller 3</option>
                            <option value="taller4">Taller 4</option>
                        </optgroup>
                    </select>
                </div>

                <div class="pc p-4 mb-4 shadow-sm border rounded-3 bg-white">
                    <h3 class="h5 fw-bold texto-azul mb-3">PC01</h3>

                    <input type="radio" id="pc01_ok" name="pc01_estado" value="ok" class="form-check-input me-1" required>
                    <label for="pc01_ok" class="form-check-label me-4 text-success fw-semibold">Sin problemas</label>

                    <input type="radio" id="pc01_error" name="pc01_estado" value="incidencia" class="form-check-input me-1">
                    <label for="pc01_error" class="form-check-label text-danger fw-semibold">Hay incidencia</label>
                   
                    <h3 class="h5 fw-bold texto-azul pt-3 mt-3 mb-3 border-top">PC02</h3>

                    <input type="radio" id="pc02_ok" name="pc02_estado" value="ok" class="form-check-input me-1" required>
                    <label for="pc02_ok" class="form-check-label me-4 text-success fw-semibold">Sin problemas</label>

                    <input type="radio" id="pc02_error" name="pc02_estado" value="incidencia"
                        class="form-check-input me-1">
                    <label for="pc02_error" class="form-check-label text-danger fw-semibold">Hay incidencia</label>

                <button type="submit" class="btn btn-warning w-100 py-3 mt-3 fw-bold text-dark fs-5 shadow-sm">
                    Registrar incidencias
                </button>
                </div>
            </form>
        </section>
        <div id="modal-incidencia"  class="modal-incidencia oculto w-100 h-100 d-flex justify-content-center align-items-center">

            <form class="from modal-contenido w-100 p-4 bg-white">

                <h3 id="titulo-modal" class="h5 fw-bold texto-azul mb-3">Registro de incidencia</h3>

                <div class="mt-3 pt-3 border-top">
                    <label for="tipo02" class="form-label fw-semibold texto-azul-dark">Tipo de incidencia</label>
                    <select id="tipo" name="tipo02" class="form-select mb-3">
                        <option value="">Seleccione</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                        <option value="red">Red</option>
                    </select>

                    <label for="asunto02" class="form-label fw-semibold texto-azul-dark">Asunto:</label>
                    <input type="text" id="asunto-modal" class="form-control mb-3"
                        placeholder="ej: Pantalla de monitor rosa">

                    <label for="persona-asig02" class="form-label fw-semibold texto-azul-dark">Persona que estaba
                        haciendo uso de la PC</label>
                    <input type="text" id="persona-modal" class="form-control mb-3"
                        placeholder="ej: Maria Jose Martinez">

                    <label class="form-label fw-semibold texto-azul-dark d-block mb-2">Gravedad de la
                        incidencia</label>
                    <div class="grupo-radios d-flex flex-wrap gap-4 mb-3">
                        <div class="opcion-radio d-flex align-items-center gap-2">
                            <input type="radio" id="ligera" name="gravedad" value="ligera" class="form-check-input">
                            <label for="ligera02" class="form-check-label text-success">Ligera</label>
                        </div>
                        <div class="opcion-radio d-flex align-items-center gap-2">
                            <input type="radio" id="media" name="gravedad" value="media" class="form-check-input">
                            <label for="media02" class="form-check-label text-warning">Media</label>
                        </div>
                        <div class="opcion-radio d-flex align-items-center gap-2">
                            <input type="radio" id="grave" name="gravedad" value="grave" class="form-check-input">
                            <label for="grave02" class="form-check-label text-danger">Grave</label>
                        </div>
                    </div>

                    <label for="descripcion02" class="form-label fw-semibold texto-azul-dark">Descripción</label>
                    <textarea id="descripcion-modal" name="descripcion02" class="form-control mb-3" placeholder="Información más detallada si así lo precisa" rows="3" maxlength="300"></textarea>
                </div>

                <button type="button" id="btnAceptarModal" class="btn btn-success">
                    Aceptar
                </button>

                <button type="button" id="btnCancelarModal" class="btn btn-danger">
                    Cancelar
                </button>

            </div>

        </form>

    </main>

    <footer>
        <span>Copyright 2026 - SGRSI | Instituto tecnológico de Informática</span>
    </footer>
    <script src="../assets/js/modalIncidencias.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/btn-menu-celular.js"></script>
        <script src="../assets/js/verificarSesion.js"></script>
          <script src="../assets/js/cerrarSesion.js"></script>


</body>

</html>
