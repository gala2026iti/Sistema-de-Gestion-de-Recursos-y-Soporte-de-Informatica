  <main>
    <form action="t-RegistroPrestamo.html">
      <h2>Registro de prestamo</h2>
      <fieldset class="tarjeta">
        <label for="CI-Solicitante">CI de la persona solicitante:</label>
        <input type="text" id="CI-Solicitante" name="CI-Solicitante" placeholder="ej: 1234578" required maxlength="8"
          inputmode="numeric">
        <label for="nombre">Nombre completo del solicitante</label>
        <input type="text" id="nombre" placeholder="ej: Javier Martinez" required pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+"
          maxlength="30">
        <div class="rol">
          <select name="" id="" required>
            <option value="">Elige el dispositivo</option>
            <option value="LAP09">LAP08</option>
            <option value="LAP08">LAP09</option>
            <option value="LAP10">LAP10</option>
            <option value="LAP12">LAP12</option>
          </select>
        </div>
        <label for="final">Cuando sera devuelto el dispositivo</label>
        <input type="datetime-local" id="final" name="final" required>
        <button type="submit" class="btn">Registrar prestamo</button>
    </form>

  </main>
