<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagina principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/index.css">

</head>

<body>
    <header>
        <img class="imagen" src="../assets/img/logo_iti.png" alt="Logo">
    </header>

    <main>
        <h2>Ingreso al sistema</h2>
        <section class="Tarjeta-login">

            <form action="formulario.html" method="get">
                <fieldset>
                    <span>Inicio de sesion</span>
                    <div>
                        <label for="cedula">Cédula</label>
                        <input type="text" id="cedula" name="cedula" placeholder="ej:12345678" autocomplete="username"
                            pattern="[1-9][0-9]{7}" title="Ingrese exactamente 8 dígitos sin puntos ni guiones"
                            inputmode="numeric" maxlength="8" required>
                    </div>
                    <div>
                        <label for="clave">Contraseña</label>
                        <input type="password" id="clave" name="clave" autocomplete="current-password" required>
                    </div>
                </fieldset>

                <button type="submit" class="btn btn-success">Iniciar Sesión</button>
            </form>
        </section>
    </main>
    <footer>
        <span>Copyright 2026 - DGTEP | Instituto tecnologico de Informática</span>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
